<svg xmlns="http://www.w3.org/2000/svg" width="670" height="844" viewBox="0 0 670 844" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="670" height="844" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="38" font-size="22" font-weight="bold" fill="#1f2933">Test scenarios: what to measure</text>

  <!-- Header row -->
  <rect x="20" y="60" width="630" height="64" fill="#1f2933"/>
  <text x="34" y="98" font-size="16" font-weight="bold" fill="#ffffff">Scenario</text>
  <text x="314" y="98" font-size="16" font-weight="bold" fill="#ffffff">Local load generator</text>

  <!-- Row backgrounds (zebra) -->
  <rect x="20" y="124" width="630" height="100" fill="#f5f7fa"/>
  <rect x="20" y="224" width="630" height="100" fill="#ffffff"/>
  <rect x="20" y="324" width="630" height="100" fill="#f5f7fa"/>
  <rect x="20" y="424" width="630" height="100" fill="#ffffff"/>
  <rect x="20" y="524" width="630" height="100" fill="#f5f7fa"/>
  <rect x="20" y="624" width="630" height="100" fill="#ffffff"/>
  <rect x="20" y="724" width="630" height="100" fill="#f5f7fa"/>

  <!-- Grid lines -->
  <g stroke="#9aa5b1" stroke-width="1" fill="none">
    <rect x="20" y="60" width="630" height="764"/>
    <line x1="300" y1="60" x2="300" y2="824"/>
    <line x1="20" y1="224" x2="650" y2="224"/>
    <line x1="20" y1="324" x2="650" y2="324"/>
    <line x1="20" y1="424" x2="650" y2="424"/>
    <line x1="20" y1="524" x2="650" y2="524"/>
    <line x1="20" y1="624" x2="650" y2="624"/>
    <line x1="20" y1="724" x2="650" y2="724"/>
  </g>

  <!-- Row 1: Baseline (reads) -->
  <text x="34" y="154" font-size="15" font-weight="bold" fill="#1f2933">Baseline (reads)</text>
  <text x="34" y="176" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis off</text>
  <text x="34" y="196" font-size="12" font-style="italic" fill="#616e7c">Load: reads · 3 runs</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="154">p95 > 200 ms at:</text><text x="474" y="154">______ req/s</text>
    <text x="314" y="176">errors > 1% at:</text><text x="474" y="176">______ req/s</text>
    <text x="314" y="198">step size:</text><text x="474" y="198">______ req/s</text>
  </g>

  <!-- Row 2: Baseline (writes) -->
  <text x="34" y="254" font-size="15" font-weight="bold" fill="#1f2933">Baseline (writes)</text>
  <text x="34" y="276" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis off</text>
  <text x="34" y="296" font-size="12" font-style="italic" fill="#616e7c">Load: writes · 3 runs</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="254">p95 > 200 ms at:</text><text x="474" y="254">______ req/s</text>
    <text x="314" y="276">errors > 1% at:</text><text x="474" y="276">______ req/s</text>
    <text x="314" y="298">step size:</text><text x="474" y="298">______ req/s</text>
  </g>

  <!-- Row 3: X-scaling the API -->
  <text x="34" y="354" font-size="15" font-weight="bold" fill="#1f2933">X-scaling the API</text>
  <text x="34" y="376" font-size="13" fill="#3e4c59">3 API · 1 Postgres · Redis off</text>
  <text x="34" y="396" font-size="12" font-style="italic" fill="#616e7c">Load: reads</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="354">p95 > 200 ms at:</text><text x="474" y="354">______ req/s</text>
    <text x="314" y="376">errors > 1% at:</text><text x="474" y="376">______ req/s</text>
    <text x="314" y="398">step size:</text><text x="474" y="398">______ req/s</text>
  </g>

  <!-- Row 4: Z-scaling the database -->
  <text x="34" y="454" font-size="15" font-weight="bold" fill="#1f2933">Z-scaling the database</text>
  <text x="34" y="476" font-size="13" fill="#3e4c59">1 API · 2 Postgres · Redis off</text>
  <text x="34" y="496" font-size="12" font-style="italic" fill="#616e7c">Load: writes</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="454">p95 > 200 ms at:</text><text x="474" y="454">______ req/s</text>
    <text x="314" y="476">errors > 1% at:</text><text x="474" y="476">______ req/s</text>
    <text x="314" y="498">step size:</text><text x="474" y="498">______ req/s</text>
  </g>

  <!-- Row 5: Redis cache -->
  <text x="34" y="554" font-size="15" font-weight="bold" fill="#1f2933">Redis cache</text>
  <text x="34" y="576" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis on</text>
  <text x="34" y="596" font-size="12" font-style="italic" fill="#616e7c">Load: reads</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="554">p95 > 200 ms at:</text><text x="474" y="554">______ req/s</text>
    <text x="314" y="576">errors > 1% at:</text><text x="474" y="576">______ req/s</text>
    <text x="314" y="598">step size:</text><text x="474" y="598">______ req/s</text>
  </g>

  <!-- Row 6: Fault isolation -->
  <text x="34" y="654" font-size="15" font-weight="bold" fill="#1f2933">Fault isolation</text>
  <text x="34" y="676" font-size="13" fill="#3e4c59">Z-scaling setup, postgres-b stopped</text>
  <text x="34" y="696" font-size="12" font-style="italic" fill="#616e7c">Load: writes · values from db:a only</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="654">p95 > 200 ms at:</text><text x="474" y="654">______ req/s</text>
    <text x="314" y="676">errors > 1% at:</text><text x="474" y="676">______ req/s</text>
    <text x="314" y="698">step size:</text><text x="474" y="698">______ req/s</text>
  </g>

  <!-- Row 7: Oversell check -->
  <text x="34" y="754" font-size="15" font-weight="bold" fill="#1f2933">Oversell check</text>
  <text x="34" y="776" font-size="13" fill="#3e4c59">Z-scaling setup, low capacity</text>
  <text x="34" y="796" font-size="12" font-style="italic" fill="#616e7c">Load: writes · correctness, not speed</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="754">sold ≤ capacity (a):</text><text x="474" y="754">yes / no</text>
    <text x="314" y="776">sold ≤ capacity (b):</text><text x="474" y="776">yes / no</text>
    <text x="314" y="798">409 answers:</text><text x="474" y="798">______</text>
  </g>
</svg>
