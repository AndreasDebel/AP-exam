# Secret: db-credentials. The API reads "a" and "b" as env vars (api.yaml); the postgres pods read the password.
# Dropped on purpose: a real password. Demo value, committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: booking
stringData:
  postgres-password: demo-password
  # Timeout=3 (#12, Isolate Faults): give up connecting after 3 s instead of Npgsql's default 15 s,
  # so requests for a dead database fail fast and don't tie up the API threads the healthy sections need.
  # Dropped on purpose: retries and fallback. A failed buy for a dead section is the expected result.
  # Maximum Pool Size=30 (load test, #30): each API copy opens at most 30 connections per database.
  # 3 copies x 30 = 90 stays under Postgres' default limit of 100, so "too many clients" never shows up as an error.
  # Load-test Baseline (1 Postgres): change b's Host to postgres-a-0.postgres-a, so every section uses database a.
  a: Host=postgres-a-0.postgres-a;Database=booking;Username=postgres;Password=demo-password;Timeout=3;Maximum Pool Size=30
  b: Host=postgres-a-0.postgres-a;Database=booking;Username=postgres;Password=demo-password;Timeout=3;Maximum Pool Size=30