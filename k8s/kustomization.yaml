# The whole system in one command, run from the repo root:
#   kubectl apply -k k8s       (start / update)
#   kubectl delete -k k8s      (stop: deletes the pods and the PVCs, but NOT the database files)
# kubectl reads this list and applies every file in it; the Namespace goes first automatically.
# Minikube keeps each volume in a folder named after the PVC (/tmp/hostpath-provisioner/booking/...)
# and never removes it. So the next "apply -k" gets the old data back, and schema.yaml
# does not run again. To start from an empty database (sold = 0), wipe the folder in between:
#   minikube ssh -- sudo rm -rf /tmp/hostpath-provisioner/booking
#
# One file per component: each holds the component's Deployment/StatefulSet and its Service.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - api.yaml
  - ui.yaml
  - redis.yaml
  - postgres-a.yaml # database a (z-scaling, #11)
  - postgres-b.yaml # database b
  - prometheus.yaml
  - schema.yaml # used by both databases
  - db-credentials.yaml # used by the API and both databases
