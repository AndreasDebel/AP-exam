name: Check source branch

on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may merge into main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Only dev can be merged into main (this PR is from ${{ github.head_ref }})"
            exit 1
          fi
