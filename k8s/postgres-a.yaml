# Database a: a StatefulSet (-> pod postgres-a-0) with its own volume (PVC), and its headless Service (further down).
# Owns sections 1-2.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-a
  namespace: booking
spec:
  serviceName: postgres-a # The headless Service below. Gives the pod the DNS name postgres-a-0.postgres-a.
  replicas: 1
  selector:
    matchLabels:
      app: postgres-a
  template:
    metadata:
      labels:
        app: postgres-a
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # Load test (#30): at most 1 CPU core, so a second database (Z-scaling) adds a core instead of sharing one.
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: "1"
          env:
            - name: POSTGRES_DB
              value: booking # The "Database=booking" in db-credentials.yaml.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Postgres runs the .sql files here once, when the data volume is empty (first start).
            # Dropped on purpose: a migration tool. The schema is one table that never changes.
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: schema
          configMap:
            name: schema # schema.yaml
  # One PVC per pod is created from this (data-postgres-a-0). The PV is provisioned automatically.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Service: postgres-a (headless). Gives the pod from the StatefulSet above the DNS name postgres-a-0.postgres-a.
apiVersion: v1
kind: Service
metadata:
  name: postgres-a
  namespace: booking
spec:
  clusterIP: None # Headless: DNS points straight at the pod.
  selector:
    app: postgres-a
