# StatefulSet: postgres-b (-> pod postgres-b-0) with its own volume (PVC). Owns sections 3-4.
# Same as postgres-a.yaml with a -> b. Its headless Service is services/postgres-b.yaml.
# It gets the same schema as postgres-a, so it also has all 4 section rows. Which database is live
# for a section is decided by the router (Sections__N in deployments/api.yaml), not by the data.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-b
  namespace: booking
spec:
  serviceName: postgres-b # The headless Service in services/postgres-b.yaml. Gives the pod the DNS name postgres-b-0.postgres-b.
  replicas: 1
  selector:
    matchLabels:
      app: postgres-b
  template:
    metadata:
      labels:
        app: postgres-b
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: booking # The "Database=booking" in secrets/db-credentials.yaml.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Postgres runs the .sql files here once, when the data volume is empty (first start).
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: schema
          configMap:
            name: schema # configmaps/schema.yaml, the same one postgres-a uses
  # One PVC per pod is created from this (data-postgres-b-0). The PV is provisioned automatically.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
