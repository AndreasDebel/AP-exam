# The UI: a Deployment (-> pod running nginx with the Blazor files) and its Service (further down).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          # LOOK HERE! The code is ui/ (Book.razor), built into nginx by ui/Dockerfile. Build command in ui/README.md.
          image: mortenj91/eventbooking-ui:latest
          imagePullPolicy: Always # Pull on every pod start, so a re-published :latest is picked up.
          readinessProbe: # The kubelet calls this; the Service only sends traffic once it succeeds.
            httpGet:
              path: /
              port: 80
---
# Service: ui (NodePort 30081). Points at the pod from the Deployment above.
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: booking
spec:
  type: NodePort
  selector:
    app: ui
  ports:
    - port: 80
      nodePort: 30081
