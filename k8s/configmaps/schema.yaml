# ConfigMap: schema. Mounted into postgres-a at /docker-entrypoint-initdb.d (statefulsets/postgres-a.yaml).
# Copy of api/Schema.sql — keep them in sync. A copy, so all of k8s/ installs with one kubectl apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema
  namespace: booking
data:
  schema.sql: |
    CREATE TABLE section (
         id       int PRIMARY KEY,
         capacity int NOT NULL,
         sold     int NOT NULL DEFAULT 0
    );

    INSERT INTO section (id, capacity) VALUES
        (1, 1000000),
        (2, 1000000),
        (3, 1000000),
        (4, 1000000);
