# nginx in the ui pod. ui/Dockerfile copies this file in.
server {
    listen 80;

    # The Blazor files (index.html, _framework/...).
    location / {
        root /usr/share/nginx/html;
    }

    # The page calls /sections/... on the address it was loaded from, so the browser only talks to this nginx.
    # LOOK HERE! nginx forwards those calls to the Service "api" (k8s/services/api.yaml) inside the cluster.
    location /sections/ {
        proxy_pass http://api:8080;
    }
}
