<svg xmlns="http://www.w3.org/2000/svg" width="670" height="924" viewBox="0 0 670 924" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="670" height="924" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="38" font-size="22" font-weight="bold" fill="#1f2933">Test scenarios: what to measure</text>

  <!-- Header row -->
  <rect x="20" y="60" width="630" height="64" fill="#1f2933"/>
  <text x="34" y="98" font-size="16" font-weight="bold" fill="#ffffff">Scenario</text>
  <text x="314" y="98" font-size="16" font-weight="bold" fill="#ffffff">Local load generator</text>

  <!-- Row backgrounds (zebra) -->
  <rect x="20" y="124" width="630" height="140" fill="#f5f7fa"/>
  <rect x="20" y="264" width="630" height="140" fill="#ffffff"/>
  <rect x="20" y="404" width="630" height="100" fill="#f5f7fa"/>
  <rect x="20" y="504" width="630" height="100" fill="#ffffff"/>
  <rect x="20" y="604" width="630" height="100" fill="#f5f7fa"/>
  <rect x="20" y="704" width="630" height="100" fill="#ffffff"/>
  <rect x="20" y="804" width="630" height="100" fill="#f5f7fa"/>

  <!-- Grid lines -->
  <g stroke="#9aa5b1" stroke-width="1" fill="none">
    <rect x="20" y="60" width="630" height="844"/>
    <line x1="300" y1="60" x2="300" y2="904"/>
    <line x1="20" y1="264" x2="650" y2="264"/>
    <line x1="20" y1="404" x2="650" y2="404"/>
    <line x1="20" y1="504" x2="650" y2="504"/>
    <line x1="20" y1="604" x2="650" y2="604"/>
    <line x1="20" y1="704" x2="650" y2="704"/>
    <line x1="20" y1="804" x2="650" y2="804"/>
  </g>

  <!-- Row 1: Baseline (reads) -->
  <text x="34" y="164" font-size="15" font-weight="bold" fill="#1f2933">1. Baseline (reads)</text>
  <text x="34" y="186" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis off</text>
  <text x="34" y="206" font-size="12" font-style="italic" fill="#616e7c">Load: reads · 3 runs</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="158">p95 > 200 ms at:</text><text x="474" y="158">avg 1767 req/s</text>
    <text x="328" y="180">max spread:</text><text x="488" y="180">± 33 req/s</text>
    <text x="314" y="202">errors > 1% at:</text><text x="474" y="202">&gt; 1850 req/s</text>
    <text x="328" y="224">max spread:</text><text x="488" y="224">- (not reached)</text>
    <text x="314" y="246">step size:</text><text x="474" y="246">50 req/s</text>
  </g>

  <!-- Row 2: Baseline (writes) -->
  <text x="34" y="304" font-size="15" font-weight="bold" fill="#1f2933">2. Baseline (writes)</text>
  <text x="34" y="326" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis off</text>
  <text x="34" y="346" font-size="12" font-style="italic" fill="#616e7c">Load: writes · 3 runs</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="298">p95 > 200 ms at:</text><text x="474" y="298">avg 217 req/s</text>
    <text x="328" y="320">max spread:</text><text x="488" y="320">± 33 req/s</text>
    <text x="314" y="342">errors > 1% at:</text><text x="474" y="342">&gt; 350 req/s</text>
    <text x="328" y="364">max spread:</text><text x="488" y="364">- (not reached)</text>
    <text x="314" y="386">step size:</text><text x="474" y="386">50 req/s</text>
  </g>

  <!-- Row 3: X-scaling the API -->
  <text x="34" y="434" font-size="15" font-weight="bold" fill="#1f2933">3. X-scaling the API</text>
  <text x="34" y="456" font-size="13" fill="#3e4c59">3 API · 1 Postgres · Redis off</text>
  <text x="34" y="476" font-size="12" font-style="italic" fill="#616e7c">Load: reads</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="434">p95 > 200 ms at:</text><text x="474" y="434">______ req/s</text>
    <text x="314" y="456">errors > 1% at:</text><text x="474" y="456">______ req/s</text>
    <text x="314" y="478">step size:</text><text x="474" y="478">______ req/s</text>
  </g>

  <!-- Row 4: Z-scaling the database -->
  <text x="34" y="534" font-size="15" font-weight="bold" fill="#1f2933">4. Z-scaling the database</text>
  <text x="34" y="556" font-size="13" fill="#3e4c59">1 API · 2 Postgres · Redis off</text>
  <text x="34" y="576" font-size="12" font-style="italic" fill="#616e7c">Load: writes</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="534">p95 > 200 ms at:</text><text x="474" y="534">______ req/s</text>
    <text x="314" y="556">errors > 1% at:</text><text x="474" y="556">______ req/s</text>
    <text x="314" y="578">step size:</text><text x="474" y="578">______ req/s</text>
  </g>

  <!-- Row 5: Redis cache -->
  <text x="34" y="634" font-size="15" font-weight="bold" fill="#1f2933">5. Redis cache</text>
  <text x="34" y="656" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis on</text>
  <text x="34" y="676" font-size="12" font-style="italic" fill="#616e7c">Load: reads</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="634">p95 > 200 ms at:</text><text x="474" y="634">______ req/s</text>
    <text x="314" y="656">errors > 1% at:</text><text x="474" y="656">______ req/s</text>
    <text x="314" y="678">step size:</text><text x="474" y="678">______ req/s</text>
  </g>

  <!-- Row 6: Fault isolation -->
  <text x="34" y="734" font-size="15" font-weight="bold" fill="#1f2933">6. Fault isolation</text>
  <text x="34" y="756" font-size="13" fill="#3e4c59">4's setup, postgres-b stopped</text>
  <text x="34" y="776" font-size="12" font-style="italic" fill="#616e7c">Load: writes · limits from db:a only</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="726">p95 > 200 ms at:</text><text x="474" y="726">______ req/s</text>
    <text x="314" y="746">errors > 1% at:</text><text x="474" y="746">______ req/s</text>
    <text x="314" y="766">step size:</text><text x="474" y="766">______ req/s</text>
    <text x="314" y="786">db:b failed:</text><text x="474" y="786">fast / hang, ___ ms</text>
  </g>

  <!-- Row 7: Oversell check -->
  <text x="34" y="834" font-size="15" font-weight="bold" fill="#1f2933">7. Oversell check</text>
  <text x="34" y="856" font-size="13" fill="#3e4c59">4's setup, low capacity</text>
  <text x="34" y="876" font-size="12" font-style="italic" fill="#616e7c">Load: writes · correctness, not speed</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="834">sold ≤ capacity (a):</text><text x="474" y="834">yes / no</text>
    <text x="314" y="856">sold ≤ capacity (b):</text><text x="474" y="856">yes / no</text>
    <text x="314" y="878">409 answers:</text><text x="474" y="878">______</text>
  </g>
</svg>
