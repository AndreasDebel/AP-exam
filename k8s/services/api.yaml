# Service: api (NodePort 30080). Load-balances over the pods from deployments/api.yaml.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: booking
spec:
  type: NodePort
  selector:
    app: api # Balances across all pods with this label.
  ports:
    - port: 8080
      nodePort: 30080
