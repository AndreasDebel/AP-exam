# Grafana: data source, storage, Deployment, and Service in one file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: booking

# LOOK HERE! Grafana queries the Prometheus Service in prometheus.yaml.
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
---
# Grafana keeps saved dashboards and settings in this volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: booking
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Deployment: grafana (1 pod). Data source is provisioned above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
# Service: grafana. Reach it with: kubectl port-forward -n booking svc/grafana 3000:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: booking
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: web
