# ConfigMap: schema. Mounted into postgres-a and postgres-b at /docker-entrypoint-initdb.d (postgres-a.yaml, postgres-b.yaml).
# Copy of api/Schema.sql — keep them in sync. A copy, so all of k8s/ installs with one kubectl apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema
  namespace: booking
data:
  schema.sql: |
    CREATE TABLE section (
         id       int PRIMARY KEY,
         capacity int NOT NULL,
         sold     int NOT NULL DEFAULT 0,
         disabled boolean NOT NULL DEFAULT false
    );

    INSERT INTO section (id, capacity) VALUES
        (1, 100),
        (2, 1000000),
        (3, 1000000),
        (4, 1000000);

    -- Load-test sections 101-140 (#30, docs/metrics/test-description.md). So many places that a speed run never sells out.
    -- Only k8s routes them (api.yaml); appsettings.json does not, so the load test runs against Minikube only.
    INSERT INTO section (id, capacity)
    SELECT id, 1000000 FROM generate_series(101, 140) AS id;