# The API: a Deployment (-> ReplicaSet -> 3 pods) and the Service in front of it (further down).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: booking
spec:
  replicas: 3 # X-scaling is this number.
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api # The Service below finds the pods by this label. Prometheus uses this label.
    spec:
      containers:
        - name: api
          # LOOK HERE! The code is api/Program.cs, published to Docker Hub with the command in api/README.md.
          image: srenits/eventbooking-api:latest
          ports:
            - name: http
              containerPort: 8080 # Port 8080 is standard for .NET-container-images, but check targetPort in the Service below – they have to match. If targetPort isn't set explicitly it's 8080.
          imagePullPolicy: Always # Pull on every pod start, so a re-published :latest is picked up.
          # Kubernetes calls GET /health on each pod (the endpoint is in api/Program.cs).
          # Until it answers 200, the Service sends the pod no requests. That matters when scaling up:
          # a new copy only joins the load balancing once it is actually ready.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          # Load test (#30): each copy may use at most a quarter of a CPU core (250m). Without a limit one copy takes every core
          # on the laptop, and 3 copies just share the same cores, so X-scaling would show nothing.
          # A quarter, not a whole core: the laptop has 4 physical cores shared with k6, and with 1 core per pod no pod
          # reached its limit even at 2200 req/s (docs/metrics/other-results/sc1-other-results.md, runs A-C).
          # requests is kept low so all pods still fit on the single Minikube node.
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 250m
          env:
            # Overrides "Redis" in api/appsettings.json (localhost). The Service in redis.yaml gives the name redis.
            - name: Redis
              value: redis:6379
            # The cache switch. Issue #10 flips it to "false" to measure the API without Redis.
            - name: CacheEnabled
              value: "false" # Quoted: env values must be strings.
            # Overrides "Sections" in api/appsettings.json (localhost). The API's router reads these.
            # Z-scaling (#11): sections 1-2 live in database a, sections 3-4 in database b.
            # Moving a section = changing its "key" below and running "kubectl apply -k k8s" (the API pods restart).
            # The "before" measurement has all four on key a.
            - name: Sections__1
              valueFrom:
                secretKeyRef:
                  name: db-credentials # db-credentials.yaml
                  key: a
            - name: Sections__2
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: a
            - name: Sections__3
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: b
            - name: Sections__4
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: b
            # Load-test sections (#30, docs/metrics/test-description.md): 101-120 in database a, 121-140 in database b.
            # 40 sections instead of 4, so buys spread over many rows and the database, not one row lock, is what gets busy.
            # Sections 1-4 above are the demo's and are left alone. One line per section, same thing as the blocks above.
            - { name: Sections__101, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__102, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__103, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__104, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__105, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__106, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__107, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__108, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__109, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__110, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__111, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__112, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__113, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__114, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__115, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__116, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__117, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__118, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__119, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__120, valueFrom: { secretKeyRef: { name: db-credentials, key: a } } }
            - { name: Sections__121, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__122, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__123, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__124, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__125, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__126, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__127, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__128, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__129, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__130, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__131, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__132, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__133, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__134, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__135, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__136, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__137, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__138, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__139, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
            - { name: Sections__140, valueFrom: { secretKeyRef: { name: db-credentials, key: b } } }
---
# Service: api (NodePort 30080). Load-balances over the pods from the Deployment above.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: booking
spec:
  type: NodePort
  selector:
    app: api # Balances across all pods with this label.
  ports:
    - port: 8080
      nodePort: 30080
