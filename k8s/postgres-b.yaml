# Database b: a StatefulSet (-> pod postgres-b-0) with its own volume (PVC), and its headless Service (further down).
# Owns sections 3-4. Same as postgres-a.yaml with a -> b.
# It gets the same schema as postgres-a, so it also has all 4 section rows. Which database is live
# for a section is decided by the router (Sections__N in api.yaml), not by the data.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-b
  namespace: booking
spec:
  serviceName: postgres-b # The headless Service below. Gives the pod the DNS name postgres-b-0.postgres-b.
  replicas: 1
  selector:
    matchLabels:
      app: postgres-b
  template:
    metadata:
      labels:
        app: postgres-b
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # Load test (#30): at most 1 CPU core. Same as postgres-a.yaml.
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: "1"
          env:
            - name: POSTGRES_DB
              value: booking # The "Database=booking" in db-credentials.yaml.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Postgres runs the .sql files here once, when the data volume is empty (first start).
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: schema
          configMap:
            name: schema # schema.yaml, the same one postgres-a uses
  # One PVC per pod is created from this (data-postgres-b-0). The PV is provisioned automatically.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Service: postgres-b (headless). Same as in postgres-a.yaml with a -> b.
apiVersion: v1
kind: Service
metadata:
  name: postgres-b
  namespace: booking
spec:
  clusterIP: None
  selector:
    app: postgres-b
