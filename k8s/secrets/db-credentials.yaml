# Secret: db-credentials. The API reads "a" and "b" as env vars (deployments/api.yaml); the postgres pods read the password.
# Dropped on purpose: a real password. Demo value, committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: booking
stringData:
  postgres-password: demo-password
  a: Host=postgres-a-0.postgres-a;Database=booking;Username=postgres;Password=demo-password
  b: Host=postgres-b-0.postgres-b;Database=booking;Username=postgres;Password=demo-password
