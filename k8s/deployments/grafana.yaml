# Deployment: grafana (1 pod). Data source is provisioned in configmaps/grafana.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
      # Dropped on purpose: UI-created dashboards and settings are temporary.
