<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Map of issue #6 (Run on Minikube): from "kubectl apply -k k8s" to a curl reaching Postgres. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box   { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 6; }
      .data  { fill: #fff8e1; }
      .db    { fill: #e3f2fd; }
      .api   { fill: #e8f5e9; }
      .svc   { fill: #f3e5f5; }
      .title { font-size: 15px; font-weight: bold; fill: #111; }
      .file  { font-size: 11.5px; fill: #555; font-family: Consolas, monospace; }
      .edge  { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .label { font-size: 11.5px; fill: #444; font-style: italic; }
      .num   { font-size: 13px; font-weight: bold; fill: #fff; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="900" fill="#fff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold">Issue #6 — Run on Minikube: the full map</text>

  <!-- 1 kustomization -->
  <rect class="box" x="270" y="60" width="360" height="52"/>
  <circle cx="290" cy="80" r="11" fill="#333"/><text class="num" x="290" y="85" text-anchor="middle">1</text>
  <text class="title" x="310" y="85">kustomization.yaml</text>
  <text class="file" x="310" y="103">k8s/kustomization.yaml:12</text>

  <path class="edge" d="M450,112 L450,148"/>
  <text class="label" x="460" y="135">declares desired state (order mostly irrelevant)</text>

  <!-- 2 namespace -->
  <rect x="30" y="150" width="840" height="610" rx="10" fill="#fff" stroke="#888" stroke-dasharray="8 5" stroke-width="1.5"/>
  <circle cx="52" cy="172" r="11" fill="#333"/><text class="num" x="52" y="177" text-anchor="middle">2</text>
  <text class="title" x="72" y="177">Namespace "booking"</text>
  <text class="file" x="240" y="177">k8s/00-namespace.yaml:3</text>

  <!-- 3 secret -->
  <rect class="box data" x="60" y="200" width="370" height="52"/>
  <circle cx="80" cy="220" r="11" fill="#333"/><text class="num" x="80" y="225" text-anchor="middle">3</text>
  <text class="title" x="100" y="225">Secret db-credentials</text>
  <text class="file" x="100" y="243">k8s/secrets/db-credentials.yaml:8</text>

  <!-- 4 configmap -->
  <rect class="box data" x="470" y="200" width="370" height="52"/>
  <circle cx="490" cy="220" r="11" fill="#333"/><text class="num" x="490" y="225" text-anchor="middle">4</text>
  <text class="title" x="510" y="225">ConfigMap schema</text>
  <text class="file" x="510" y="243">k8s/configmaps/schema.yaml:9</text>

  <!-- 5 statefulset -->
  <rect class="box db" x="200" y="310" width="500" height="52"/>
  <circle cx="220" cy="330" r="11" fill="#333"/><text class="num" x="220" y="335" text-anchor="middle">5</text>
  <text class="title" x="240" y="335">StatefulSet postgres-a</text>
  <text class="file" x="240" y="353">k8s/statefulsets/postgres-a.yaml:4</text>

  <path class="edge" d="M300,252 L300,308"/>
  <text class="label" x="310" y="285">password (env)</text>
  <path class="edge" d="M600,252 L600,308"/>
  <text class="label" x="610" y="285">mounted at /docker-entrypoint-initdb.d</text>

  <!-- 6 headless service -->
  <rect class="box svc" x="200" y="420" width="500" height="52"/>
  <circle cx="220" cy="440" r="11" fill="#333"/><text class="num" x="220" y="445" text-anchor="middle">6</text>
  <text class="title" x="240" y="445">Service postgres-a (headless)</text>
  <text class="file" x="240" y="463">k8s/services/postgres-a.yaml:8</text>

  <path class="edge" d="M450,420 L450,364"/>
  <text class="label" x="460" y="396">selector app: postgres-a</text>

  <!-- 7 deployment -->
  <rect class="box api" x="200" y="540" width="500" height="52"/>
  <circle cx="220" cy="560" r="11" fill="#333"/><text class="num" x="220" y="565" text-anchor="middle">7</text>
  <text class="title" x="240" y="565">Deployment api</text>
  <text class="file" x="240" y="583">k8s/deployments/api.yaml:8</text>

  <path class="edge" d="M90,252 L90,566 L198,566"/>
  <text class="label" x="98" y="480">conn. string "a"</text>
  <text class="label" x="98" y="495">as Sections__1..4</text>

  <path class="edge" d="M450,540 L450,474"/>
  <text class="label" x="460" y="512">looks up name, connects straight to pod</text>

  <!-- 8 api service -->
  <rect class="box svc" x="200" y="660" width="500" height="52"/>
  <circle cx="220" cy="680" r="11" fill="#333"/><text class="num" x="220" y="685" text-anchor="middle">8</text>
  <text class="title" x="240" y="685">Service api (NodePort)</text>
  <text class="file" x="240" y="703">k8s/services/api.yaml:8</text>

  <path class="edge" d="M450,660 L450,594"/>
  <text class="label" x="460" y="632">selector app: api</text>

  <!-- 9 outside the cluster -->
  <rect class="box" x="200" y="810" width="500" height="52"/>
  <circle cx="220" cy="830" r="11" fill="#333"/><text class="num" x="220" y="835" text-anchor="middle">9</text>
  <text class="title" x="240" y="835">Your machine (curl / browser / load generator)</text>
  <text class="file" x="240" y="853">k8s/README.md:14</text>

  <path class="edge" d="M450,810 L450,714"/>
  <text class="label" x="460" y="785">tunnel → node port 30080</text>
</svg>
