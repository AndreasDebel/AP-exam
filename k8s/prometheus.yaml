# Prometheus: scrapes each api pod. Four parts, top to bottom:
#   ConfigMap (what to scrape) -> RBAC (permission to list pods) -> Deployment (1 pod) -> Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: booking
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s # Short so the demo updates fast.
    scrape_configs:
      - job_name: api
        kubernetes_sd_configs:
          - role: pod # gør, at Prometheus finder hver pod og scraper <pod-IP>:8080/metrics.
            namespaces:
              names: [booking] # The Role only allows "booking".
        relabel_configs:
          # Keep only pods with label app=api.
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: api
            action: keep
          # Keep only the port named "http" (from api.yaml).
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          # Put the pod name in a "pod" label.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_ready]
            target_label: pod_ready
      # Load test (#30): CPU per pod, for the "why did this row not improve?" panel in Grafana.
      # cAdvisor is a meter built into Kubernetes on every node; it measures CPU and memory per container.
      # LOOK HERE! Prometheus asks the Kubernetes API server, which forwards to the node's cAdvisor.
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token # The ServiceAccount's token (ClusterRole below)
        kubernetes_sd_configs:
          - role: node # One target per node. Minikube has one.
        relabel_configs:
          # Scrape through the API server: https://kubernetes.default.svc/api/v1/nodes/<node>/proxy/metrics/cadvisor
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          # Keep only CPU for our own namespace; cAdvisor sends thousands of other series.
          - source_labels: [__name__, namespace]
            regex: container_cpu_usage_seconds_total;booking
            action: keep
---
# RBAC: lets Prometheus list pods in "booking" so it can scrape each pod (kubernetes_sd_configs above).
apiVersion: v1
kind: ServiceAccount # den identitet, Prometheus-pod'en kører med.
metadata:
  name: prometheus
  namespace: booking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role # giver lov til at læse pods, kun i booking. Role frem for en ClusterRole, så Prometheus kun kan se vores eget namespace og ikke hele clusteret.
metadata:
  name: prometheus
  namespace: booking
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding # kobler ServiceAccount og Role sammen.
metadata:
  name: prometheus
  namespace: booking
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: booking
roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole: lets Prometheus read cAdvisor's CPU numbers (the "cadvisor" job above).
# A ClusterRole, not a Role, because nodes do not belong to a namespace. It only allows reading nodes, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cadvisor
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-cadvisor
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: booking
roleRef:
  kind: ClusterRole
  name: prometheus-cadvisor
  apiGroup: rbac.authorization.k8s.io
---
# Deployment: prometheus (1 pod), using the config and the ServiceAccount above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus # The ServiceAccount above, so it may list pods.
      containers:
        - name: prometheus
          image: prom/prometheus:v3
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          # Load test (#30): a small cap, so Prometheus cannot take CPU from the API and databases being measured.
          resources:
            requests:
              cpu: 50m
            limits:
              cpu: 500m
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config # The ConfigMap at the top of this file.
      # Dropped on purpose: persistent storage. Data is lost when the pod restarts (fine for the demo).
---
# Service: prometheus. Reach it with: kubectl port-forward -n booking svc/prometheus 9090:9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: booking
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
