  <!-- Row 1. Baseline (reads) -->
  <text x="34" y="158" font-size="15" font-weight="bold" fill="#1f2933">1. Baseline (reads)</text>
  <text x="34" y="180" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis off</text>
  <text x="34" y="202" font-size="12" font-style="italic" fill="#616e7c">Load: reads · 3 runs</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="141.5">p95 > 200 ms at:</text><text x="478" y="141.5">avg 1767 req/s</text>
    <text x="314" y="167.5">max spread:</text><text x="478" y="167.5">± 33 req/s</text>
    <text x="314" y="193.5">errors > 1% at:</text><text x="478" y="193.5">&gt; 1850 req/s</text>
    <text x="314" y="219.5">max spread:</text><text x="478" y="219.5">- (not reached)</text>
    <text x="314" y="245.5">step size:</text><text x="478" y="245.5">50 req/s</text>
  </g>

  <!-- Row 2. Baseline (writes) -->
  <text x="34" y="288" font-size="15" font-weight="bold" fill="#1f2933">2. Baseline (writes)</text>
  <text x="34" y="310" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis off</text>
  <text x="34" y="332" font-size="12" font-style="italic" fill="#616e7c">Load: writes · 3 runs</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="271.5">p95 > 200 ms at:</text><text x="478" y="271.5">avg 217 req/s</text>
    <text x="314" y="297.5">max spread:</text><text x="478" y="297.5">± 33 req/s</text>
    <text x="314" y="323.5">errors > 1% at:</text><text x="478" y="323.5">&gt; 350 req/s</text>
    <text x="314" y="349.5">max spread:</text><text x="478" y="349.5">- (not reached)</text>
    <text x="314" y="375.5">max got through:</text><text x="478" y="375.5">avg 200 req/s</text>
    <text x="314" y="401.5">max spread:</text><text x="478" y="401.5">± 3 req/s</text>
    <text x="314" y="427.5">step size:</text><text x="478" y="427.5">50 req/s</text>
  </g>

  <!-- Row 3. X-scaling the API -->
  <text x="34" y="470" font-size="15" font-weight="bold" fill="#1f2933">3. X-scaling the API</text>
  <text x="34" y="492" font-size="13" fill="#3e4c59">3 API · 1 Postgres · Redis off</text>
  <text x="34" y="514" font-size="12" font-style="italic" fill="#616e7c">Load: reads · compare with 1</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="458.2">p95 > 200 ms at:</text><text x="478" y="458.2">1750 req/s</text>
    <text x="314" y="493.5">errors > 1% at:</text><text x="478" y="493.5">&gt; 1850 req/s</text>
    <text x="314" y="528.8">step size:</text><text x="478" y="528.8">50 req/s</text>
  </g>

  <!-- Row 4. Z-scaling the database -->
  <text x="34" y="576" font-size="15" font-weight="bold" fill="#1f2933">4. Z-scaling the database</text>
  <text x="34" y="598" font-size="13" fill="#3e4c59">1 API · 2 Postgres · Redis off</text>
  <text x="34" y="620" font-size="12" font-style="italic" fill="#616e7c">Load: writes · compare with 2</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="559.8">p95 > 200 ms at:</text><text x="478" y="559.8">&gt; 500 req/s</text>
    <text x="314" y="586.2">errors > 1% at:</text><text x="478" y="586.2">&gt; 500 req/s</text>
    <text x="314" y="612.8">max got through:</text><text x="478" y="612.8">330 req/s</text>
    <text x="314" y="639.2">step size:</text><text x="478" y="639.2">50 req/s</text>
  </g>

  <!-- Row 5. Redis cache -->
  <text x="34" y="682" font-size="15" font-weight="bold" fill="#1f2933">5. Redis cache</text>
  <text x="34" y="704" font-size="13" fill="#3e4c59">1 API · 1 Postgres · Redis on</text>
  <text x="34" y="726" font-size="12" font-style="italic" fill="#616e7c">Load: reads · compare with 1</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="670.2">p95 > 200 ms at:</text><text x="478" y="670.2">&gt; 4000 req/s</text>
    <text x="314" y="705.5">errors > 1% at:</text><text x="478" y="705.5">&gt; 4000 req/s</text>
    <text x="314" y="740.8">step size:</text><text x="478" y="740.8">500 req/s</text>
  </g>

  <!-- Row 6. Fault isolation -->
  <text x="34" y="788" font-size="15" font-weight="bold" fill="#1f2933">6. Fault isolation</text>
  <text x="34" y="810" font-size="13" fill="#3e4c59">8's setup, postgres-b stopped</text>
  <text x="34" y="832" font-size="12" font-style="italic" fill="#616e7c">Load: writes · compare with 8</text>
  <text x="34" y="848" font-size="12" font-style="italic" fill="#616e7c">half to a, half to b, 15 VUs each</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="771.5">p95 > 200 ms (a):</text><text x="478" y="771.5">&gt; 500 req/s</text>
    <text x="314" y="797.5">errors > 1% (a):</text><text x="478" y="797.5">&gt; 500 req/s</text>
    <text x="314" y="823.5">max got thru (a):</text><text x="478" y="823.5">250 req/s (all sent)</text>
    <text x="314" y="849.5">step size:</text><text x="478" y="849.5">50 req/s</text>
    <text x="314" y="875.5">db:b failed:</text><text x="478" y="875.5">fast · HTTP 500</text>
  </g>

  <!-- Row 7. Oversell check -->
  <text x="34" y="918" font-size="15" font-weight="bold" fill="#1f2933">7. Oversell check</text>
  <text x="34" y="940" font-size="13" fill="#3e4c59">8's setup, low capacity</text>
  <text x="34" y="962" font-size="12" font-style="italic" fill="#616e7c">Load: writes · correctness, not speed</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="906.2">sold ≤ capacity (a):</text><text x="478" y="906.2">yes (max 100)</text>
    <text x="314" y="941.5">sold ≤ capacity (b):</text><text x="478" y="941.5">yes (max 100)</text>
    <text x="314" y="976.8">409 answers:</text><text x="478" y="976.8">31,773</text>
  </g>

  <!-- Row 8. X+Z scaling -->
  <text x="34" y="1024" font-size="15" font-weight="bold" fill="#1f2933">8. X+Z scaling</text>
  <text x="34" y="1046" font-size="13" fill="#3e4c59">3 API · 2 Postgres · Redis off</text>
  <text x="34" y="1068" font-size="12" font-style="italic" fill="#616e7c">Load: writes · compare with 4</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="1007.8">p95 > 200 ms at:</text><text x="478" y="1007.8">&gt; 500 req/s</text>
    <text x="314" y="1034.2">errors > 1% at:</text><text x="478" y="1034.2">&gt; 500 req/s</text>
    <text x="314" y="1060.8">max got through:</text><text x="478" y="1060.8">500 req/s (all sent)</text>
    <text x="314" y="1087.2">step size:</text><text x="478" y="1087.2">50 req/s</text>
  </g>

  <!-- Row 9. X-scaling + Redis -->
  <text x="34" y="1130" font-size="15" font-weight="bold" fill="#1f2933">9. X-scaling + Redis</text>
  <text x="34" y="1152" font-size="13" fill="#3e4c59">3 API · 1 Postgres · Redis on</text>
  <text x="34" y="1174" font-size="12" font-style="italic" fill="#616e7c">Load: reads · compare with 5</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933">
    <text x="314" y="1118.2">p95 > 200 ms at:</text><text x="478" y="1118.2">&gt; 8000 req/s</text>
    <text x="314" y="1153.5">errors > 1% at:</text><text x="478" y="1153.5">&gt; 8000 req/s</text>
    <text x="314" y="1188.8">step size:</text><text x="478" y="1188.8">1000 req/s</text>
  </g>
</svg>
